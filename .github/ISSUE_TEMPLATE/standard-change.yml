name: Standard change proposal
description: Propose a change to OpenPDS requirements, guidance, or templates.
title: "[Change]: "
labels: ["standard-change"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: Identify evidence classes and supporting material.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and migration impact
