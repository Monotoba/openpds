name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --no-sync --python ${{ matrix.python-version }} ruff check .

      - name: Type check
        run: uv run --no-sync --python ${{ matrix.python-version }} mypy src

      - name: Test
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest

      - name: Check distribution build
        run: |
          uv run --no-sync --python ${{ matrix.python-version }} python -m build
          VERSION="$(uv run --no-sync --python ${{ matrix.python-version }} python -c 'from importlib.metadata import version; print(version("openpds"))')"
          uv run --no-sync --python ${{ matrix.python-version }} openpds release "$VERSION"
          OPENPDS_RELEASE_VERSION="$VERSION" python - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ['OPENPDS_RELEASE_VERSION']
          archive = Path(f'release/openpds-{version}.zip')
          assert archive.is_file()
          assert sha256(archive.read_bytes()).hexdigest() == json.loads(
              Path(f'release/openpds-{version}-SHA256.json').read_text()
          )[archive.name]
          with ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              assert any(name.endswith('/MANIFEST.json') for name in bundle.namelist())
          assert list(Path('dist').glob(f'openpds-{version}-*.whl'))
          PY
