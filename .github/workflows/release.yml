name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Verify tag matches package version
        run: |
          VERSION="$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("openpds"))')"
          test "$VERSION" = "${GITHUB_REF_NAME#v}"

      - name: Build Python package
        run: uv run --no-sync python -m build

      - name: Build OpenPDS documentation release
        run: uv run --no-sync openpds release "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          fail_on_unmatched_files: true
          files: |
            dist/*
            release/*.zip
            release/*SHA256.json
