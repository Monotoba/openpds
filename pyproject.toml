[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openpds"
version = "0.1.3a1"
description = "Offline-first product development standard and automation toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Monotoba"}]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0.12,<7",
  "build>=1.2,<2",
]

[project.scripts]
openpds = "openpds.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openpds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=openpds --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["openpds"]
mypy_path = "src"
